<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hiro 3D Model Maker</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#0d0d0f;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
font:inherit;
}

button{
border:0;
color:#fff;
background:#29292d;
border-radius:11px;
font-weight:600;
}

button:active{
transform:scale(.97);
background:#444;
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

#top{
height:58px;
flex-shrink:0;
display:flex;
align-items:center;
gap:8px;
padding:8px 10px;
background:#18181b;
border-bottom:1px solid #303035;
z-index:20;
}

#title{
font-size:17px;
font-weight:800;
margin-right:auto;
white-space:nowrap;
}

.topButton{
height:42px;
padding:0 13px;
}

#main{
display:flex;
flex:1;
min-height:0;
}

#left{
width:205px;
flex-shrink:0;
background:#18181b;
border-right:1px solid #303035;
padding:12px;
overflow:auto;
}

#center{
position:relative;
flex:1;
min-width:0;
min-height:0;
background:#101014;
overflow:hidden;
}

#right{
width:255px;
flex-shrink:0;
background:#18181b;
border-left:1px solid #303035;
padding:12px;
overflow:auto;
}

#canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
touch-action:none;
}

#hint{
position:absolute;
left:50%;
bottom:15px;
transform:translateX(-50%);
padding:9px 14px;
border-radius:12px;
background:rgba(0,0,0,.65);
font-size:11px;
color:#bbb;
white-space:nowrap;
pointer-events:none;
}

.sectionTitle{
font-size:12px;
font-weight:800;
color:#aaa;
margin:3px 0 9px;
}

.addGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.addButton{
height:68px;
font-size:10px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
background:#252529;
}

.addIcon{
font-size:23px;
}

#objectList{
display:flex;
flex-direction:column;
gap:6px;
}

.object{
width:100%;
min-height:44px;
padding:8px 10px;
text-align:left;
background:#252529;
border:1px solid transparent;
}

.object.selected{
background:#3a3a40;
border-color:#777;
}

.editorTitle{
font-size:15px;
font-weight:800;
margin-bottom:14px;
}

#empty{
padding:12px;
border-radius:10px;
background:#222226;
color:#888;
font-size:12px;
line-height:1.6;
}

.field{
margin-bottom:13px;
}

.field label{
display:block;
font-size:11px;
font-weight:700;
color:#999;
margin-bottom:6px;
}

.field input{
width:100%;
height:40px;
padding:0 9px;
border:1px solid #3d3d43;
border-radius:9px;
background:#252529;
color:#fff;
outline:none;
}

.row{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px;
}

#color,
#m_color{
padding:4px;
}

.delete{
width:100%;
height:44px;
margin-top:5px;
background:#8d2929;
}

.mobilePanel{
display:none;
}

#bottom{
display:none;
}

@media(max-width:650px){

#top{
height:54px;
padding:7px 8px;
}

#title{
font-size:14px;
}

.topButton{
height:38px;
padding:0 9px;
font-size:10px;
}

#left,
#right{
display:none;
}

#main{
position:relative;
}

#center{
padding-bottom:0;
}

#bottom{
display:grid;
position:fixed;
left:0;
right:0;
bottom:0;
width:100%;
height:68px;
grid-template-columns:repeat(4,1fr);
gap:6px;
padding:7px;
padding-bottom:7px;
background:#18181b;
border-top:1px solid #303035;
z-index:9999;
}

.bottomButton{
height:54px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
background:#29292d;
font-size:10px;
}

.bottomIcon{
font-size:20px;
line-height:20px;
}

.mobilePanel{
position:fixed;
left:8px;
right:8px;
bottom:76px;
max-height:70vh;
overflow:auto;
background:#1b1b1f;
border:1px solid #444;
border-radius:16px;
padding:12px;
box-shadow:0 10px 40px rgba(0,0,0,.6);
z-index:10000;
}

.mobilePanel.open{
display:block;
}

.panelHeader{
display:flex;
align-items:center;
margin-bottom:10px;
}

.panelHeader strong{
margin-right:auto;
font-size:14px;
}

.closePanel{
width:36px;
height:36px;
font-size:20px;
}

.mobileAddGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.mobileAddButton{
height:65px;
font-size:10px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
background:#29292d;
}

.mobileAddIcon{
font-size:22px;
}

#mobileObjectsList{
display:flex;
flex-direction:column;
gap:6px;
}

#mobileEditor{
display:none;
}

#mobileEditor.show{
display:block;
}

}

@media(max-width:400px){

.mobileAddGrid{
grid-template-columns:repeat(2,1fr);
}

}
</style>
</head>

<button class="mobileAddButton" data-type="cylinder">
<span class="mobileAddIcon">⬭</span>

<script>

"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let objects=[];
let selected=null;
let counter=1;

const camera={
yaw:-0.7,
pitch:0.45,
distance:7
};

let pointers=new Map();
let dragStart=null;
let lastX=0;
let lastY=0;
let moved=false;
let pinchDistance=0;
let pinchZoom=7;

const names={
cube:"立方体",
box:"直方体",
sphere:"球",
cylinder:"円柱",
cone:"円錐",
torus:"トーラス",
pyramid:"四角錐",
prism:"三角柱",
plane:"平面",
capsule:"カプセル"
};

const colors={
cube:"#4da3ff",
box:"#4da3ff",
sphere:"#ff6688",
cylinder:"#72d66f",
cone:"#ffc857",
torus:"#a875ff",
pyramid:"#ff8c42",
prism:"#4dd9ff",
plane:"#aaaaaa",
capsule:"#ff66c4"
};

function resize(){

const dpr=Math.min(window.devicePixelRatio||1,2);
const r=canvas.getBoundingClientRect();

canvas.width=Math.max(1,Math.floor(r.width*dpr));
canvas.height=Math.max(1,Math.floor(r.height*dpr));

ctx.setTransform(dpr,0,0,dpr,0,0);

draw();

}

window.addEventListener("resize",resize);

function rad(v){
return v*Math.PI/180;
}

function rotate(p,rx,ry,rz){

let x=p.x;
let y=p.y;
let z=p.z;

let c=Math.cos(rx);
let s=Math.sin(rx);

let ny=y*c-z*s;
let nz=y*s+z*c;

y=ny;
z=nz;

c=Math.cos(ry);
s=Math.sin(ry);

let nx=x*c+z*s;
nz=-x*s+z*c;

x=nx;
z=nz;

c=Math.cos(rz);
s=Math.sin(rz);

nx=x*c-y*s;
ny=x*s+y*c;

x=nx;
y=ny;

return{x,y,z};

}

function worldPoint(p,o){

let r=rotate(
{
x:p.x*o.sx,
y:p.y*o.sy,
z:p.z*o.sz
},
rad(o.rx),
rad(o.ry),
rad(o.rz)
);

r.x+=o.x;
r.y+=o.y;
r.z+=o.z;

return r;

}

function project(p){

const cy=Math.cos(camera.yaw);
const sy=Math.sin(camera.yaw);

let x=p.x*cy-p.z*sy;
let z=p.x*sy+p.z*cy;

const cp=Math.cos(camera.pitch);
const sp=Math.sin(camera.pitch);

let y=p.y*cp-z*sp;

z=p.y*sp+z*cp;

const r=canvas.getBoundingClientRect();

const scale=Math.min(r.width,r.height)/camera.distance;

return{
x:r.width/2+x*scale,
y:r.height/2-y*scale,
z:z
};

}

function addObject(type){

const o={
type:type,
name:names[type]+"_"+counter++,
x:0,
y:0,
z:0,
rx:0,
ry:0,
rz:0,
sx:1,
sy:1,
sz:1,
color:colors[type]
};

if(type==="box"){
o.sx=1.8;
o.sy=1;
o.sz=1.2;
}

if(type==="cylinder"){
o.sx=1;
o.sy=1.5;
o.sz=1;
}

if(type==="cone"){
o.sx=1;
o.sy=1.5;
o.sz=1;
}

if(type==="torus"){
o.sx=1.3;
o.sy=1;
o.sz=1.3;
}

if(type==="plane"){
o.sx=2;
o.sy=1;
o.sz=2;
}

if(type==="capsule"){
o.sx=1;
o.sy=1.8;
o.sz=1;
}

objects.push(o);
selected=o;

updateUI();

}

document.querySelectorAll("[data-type]").forEach(function(b){

b.addEventListener("click",function(){

addObject(b.dataset.type);

const panel=b.closest(".mobilePanel");

if(panel){
panel.classList.remove("open");
}

});

});

function updateUI(){

updateLists();
updateEditors();
draw();

}

function updateLists(){

const list=document.getElementById("objectList");
const mobile=document.getElementById("mobileObjectsList");

list.innerHTML="";
mobile.innerHTML="";

if(objects.length===0){

mobile.innerHTML=
'<div style="color:#888;font-size:12px">パーツがありません。</div>';

return;

}

objects.forEach(function(o){

const a=document.createElement("button");
const b=document.createElement("button");

a.className="object";
b.className="object";

if(o===selected){
a.classList.add("selected");
b.classList.add("selected");
}

a.textContent=o.name;
b.textContent=o.name;

a.addEventListener("click",function(){
selected=o;
updateUI();
});

b.addEventListener("click",function(){
selected=o;
updateUI();

document.getElementById("partsPanel")
.classList.remove("open");

document.getElementById("settingsPanel")
.classList.add("open");
});

list.appendChild(a);
mobile.appendChild(b);

});

}

function setValues(prefix){

if(!selected)return;

document.getElementById(prefix+"name").value=selected.name;
document.getElementById(prefix+"px").value=selected.x;
document.getElementById(prefix+"py").value=selected.y;
document.getElementById(prefix+"pz").value=selected.z;

document.getElementById(prefix+"rx").value=selected.rx;
document.getElementById(prefix+"ry").value=selected.ry;
document.getElementById(prefix+"rz").value=selected.rz;

document.getElementById(prefix+"sx").value=selected.sx;
document.getElementById(prefix+"sy").value=selected.sy;
document.getElementById(prefix+"sz").value=selected.sz;

document.getElementById(prefix+"color").value=selected.color;

}

function updateEditors(){

const empty=document.getElementById("empty");
const editor=document.getElementById("editor");

if(selected){

empty.style.display="none";
editor.style.display="block";

setValues("");

}else{

empty.style.display="block";
editor.style.display="none";

}

const me=document.getElementById("mobileEditor");
const mn=document.getElementById("mobileNoSelection");

if(selected){

me.classList.add("show");
mn.style.display="none";

setValues("m_");

}else{

me.classList.remove("show");
mn.style.display="block";

}

}

function val(id,old){

const n=parseFloat(document.getElementById(id).value);

return Number.isFinite(n)?n:old;

}

function mval(id,old){

const n=parseFloat(
document.getElementById("m_"+id).value
);

return Number.isFinite(n)?n:old;

}

function updateFromDesktop(){

if(!selected)return;

selected.name=
document.getElementById("name").value||"Object";

selected.x=val("px",selected.x);
selected.y=val("py",selected.y);
selected.z=val("pz",selected.z);

selected.rx=val("rx",selected.rx);
selected.ry=val("ry",selected.ry);
selected.rz=val("rz",selected.rz);

selected.sx=Math.max(.05,val("sx",selected.sx));
selected.sy=Math.max(.05,val("sy",selected.sy));
selected.sz=Math.max(.05,val("sz",selected.sz));

selected.color=
document.getElementById("color").value;

updateUI();

}

function updateFromMobile(){

if(!selected)return;

selected.name=
document.getElementById("m_name").value||"Object";

selected.x=mval("px",selected.x);
selected.y=mval("py",selected.y);
selected.z=mval("pz",selected.z);

selected.rx=mval("rx",selected.rx);
selected.ry=mval("ry",selected.ry);
selected.rz=mval("rz",selected.rz);

selected.sx=Math.max(.05,mval("sx",selected.sx));
selected.sy=Math.max(.05,mval("sy",selected.sy));
selected.sz=Math.max(.05,mval("sz",selected.sz));

selected.color=
document.getElementById("m_color").value;

updateUI();

}

[
"name",
"px","py","pz",
"rx","ry","rz",
"sx","sy","sz",
"color"
].forEach(function(id){

document.getElementById(id)
.addEventListener("input",updateFromDesktop);

document.getElementById("m_"+id)
.addEventListener("input",updateFromMobile);

});

function deleteSelected(){

if(!selected)return;

objects=objects.filter(function(o){
return o!==selected;
});

selected=objects.length?
objects[objects.length-1]:
null;

updateUI();

}

document.getElementById("deleteButton")
.addEventListener("click",deleteSelected);

document.getElementById("mobileDelete")
.addEventListener("click",deleteSelected);

function resetCamera(){

camera.yaw=-0.7;
camera.pitch=0.45;
camera.distance=7;

draw();

}

document.getElementById("resetButton")
.addEventListener("click",resetCamera);

document.getElementById("mobileReset")
.addEventListener("click",resetCamera);

function openPanel(id){

document.querySelectorAll(".mobilePanel")
.forEach(function(p){
p.classList.remove("open");
});

document.getElementById(id)
.classList.add("open");

}

document.getElementById("mobileAdd")
.addEventListener("click",function(){
openPanel("addPanel");
});

document.getElementById("mobileParts")
.addEventListener("click",function(){
openPanel("partsPanel");
});

document.getElementById("mobileSettings")
.addEventListener("click",function(){
openPanel("settingsPanel");
});

document.querySelectorAll("[data-close]")
.forEach(function(b){

b.addEventListener("click",function(){

document.getElementById(
b.dataset.close
).classList.remove("open");

});

});

function boxMesh(o){

const x=.5;
const y=.5;
const z=.5;

const v=[
{x:-x,y:-y,z:-z},
{x:x,y:-y,z:-z},
{x:x,y:y,z:-z},
{x:-x,y:y,z:-z},
{x:-x,y:-y,z:z},
{x:x,y:-y,z:z},
{x:x,y:y,z:z},
{x:-x,y:y,z:z}
];

const f=[
[0,1,2,3],
[4,7,6,5],
[0,4,5,1],
[3,2,6,7],
[1,5,6,2],
[0,3,7,4]
];

return{
vertices:v.map(function(p){
return worldPoint(p,o);
}),
faces:f
};

}

function sphereMesh(o){

const vertices=[];
const fs=[];

const lat=14;
const lon=20;

for(let y=0;y<=lat;y++){

const a=Math.PI*y/lat;
const sy=Math.cos(a);
const r=Math.sin(a);

for(let x=0;x<lon;x++){

const b=Math.PI*2*x/lon;

vertices.push(
worldPoint(
{
x:r*Math.cos(b),
y:sy,
z:r*Math.sin(b)
},
o
)
);

}

}

for(let y=0;y<lat;y++){

for(let x=0;x<lon;x++){

const a=y*lon+x;
const b=y*lon+(x+1)%lon;
const c=(y+1)*lon+(x+1)%lon;
const d=(y+1)*lon+x;

fs.push([a,b,c,d]);

}

}

return{
vertices:vertices,
faces:fs
};

}

function cylinderMesh(o,cone){

const vertices=[];
const fs=[];

const segments=24;

for(let i=0;i<segments;i++){

const a=Math.PI*2*i/segments;

vertices.push(
worldPoint(
{
x:Math.cos(a)*.5,
y:-.5,
z:Math.sin(a)*.5
},
o
)
);

}

for(let i=0;i<segments;i++){

const a=Math.PI*2*i/segments;

vertices.push(
worldPoint(
{
x:Math.cos(a)*(cone?0:.5),
y:.5,
z:Math.sin(a)*(cone?0:.5)
},
o
)
);

}

for(let i=0;i<segments;i++){

const n=(i+1)%segments;

fs.push([
i,
n,
segments+n,
segments+i
]);

}

const bottom=[];

for(let i=segments-1;i>=0;i--){
bottom.push(i);
}

fs.push(bottom);

const top=[];

for(let i=0;i<segments;i++){
top.push(segments+i);
}

fs.push(top);

return{
vertices:vertices,
faces:fs
};

}

function torusMesh(o){

const vertices=[];
const fs=[];

const major=1;
const minor=.28;
const aSeg=24;
const bSeg=10;

for(let i=0;i<aSeg;i++){

const a=Math.PI*2*i/aSeg;

for(let j=0;j<bSeg;j++){

const b=Math.PI*2*j/bSeg;

const r=major+minor*Math.cos(b);

vertices.push(
worldPoint(
{
x:r*Math.cos(a),
y:minor*Math.sin(b),
z:r*Math.sin(a)
},
o
)
);

}

}

for(let i=0;i<aSeg;i++){

for(let j=0;j<bSeg;j++){

const ni=(i+1)%aSeg;
const nj=(j+1)%bSeg;

fs.push([
i*bSeg+j,
ni*bSeg+j,
ni*bSeg+nj,
i*bSeg+nj
]);

}

}

return{
vertices:vertices,
faces:fs
};

}

function pyramidMesh(o){

const v=[
{x:-.5,y:-.5,z:-.5},
{x:.5,y:-.5,z:-.5},
{x:.5,y:-.5,z:.5},
{x:-.5,y:-.5,z:.5},
{x:0,y:.7,z:0}
];

return{
vertices:v.map(function(p){
return worldPoint(p,o);
}),
faces:[
[0,3,2,1],
[0,1,4],
[1,2,4],
[2,3,4],
[3,0,4]
]
};

}

function prismMesh(o){

const v=[
{x:-.5,y:-.5,z:-.5},
{x:.5,y:-.5,z:-.5},
{x:0,y:.5,z:-.5},
{x:-.5,y:-.5,z:.5},
{x:.5,y:-.5,z:.5},
{x:0,y:.5,z:.5}
];

return{
vertices:v.map(function(p){
return worldPoint(p,o);
}),
faces:[
[0,2,1],
[3,4,5],
[0,1,4,3],
[1,2,5,4],
[2,0,3,5]
]
};

}

function planeMesh(o){

const v=[
{x:-.5,y:0,z:-.5},
{x:.5,y:0,z:-.5},
{x:.5,y:0,z:.5},
{x:-.5,y:0,z:.5}
];

return{
vertices:v.map(function(p){
return worldPoint(p,o);
}),
faces:[[0,1,2,3]]
};

}

function capsuleMesh(o){

const vertices=[];
const fs=[];

const lat=18;
const lon=20;

for(let y=0;y<=lat;y++){

const t=y/lat;
const angle=Math.PI*t;

let yy=Math.cos(angle);
let rr=Math.sin(angle);

yy*=.75;

if(y<lat/2){
yy-=.45;
}else{
yy+=.45;
}

for(let x=0;x<lon;x++){

const a=Math.PI*2*x/lon;

vertices.push(
worldPoint(
{
x:rr*Math.cos(a),
y:yy,
z:rr*Math.sin(a)
},
o
)
);

}

}

for(let y=0;y<lat;y++){

for(let x=0;x<lon;x++){

const n=(x+1)%lon;

fs.push([
y*lon+x,
y*lon+n,
(y+1)*lon+n,
(y+1)*lon+x
]);

}

}

return{
vertices:vertices,
faces:fs
};

}

function getMesh(o){

if(o.type==="cube"||o.type==="box"){
return boxMesh(o);
}

if(o.type==="sphere"){
return sphereMesh(o);
}

if(o.type==="cylinder"){
return cylinderMesh(o,false);
}

if(o.type==="cone"){
return cylinderMesh(o,true);
}

if(o.type==="torus"){
return torusMesh(o);
}

if(o.type==="pyramid"){
return pyramidMesh(o);
}

if(o.type==="prism"){
return prismMesh(o);
}

if(o.type==="plane"){
return planeMesh(o);
}

if(o.type==="capsule"){
return capsuleMesh(o);
}

return boxMesh(o);

}

function hexRgb(hex){

return[
parseInt(hex.slice(1,3),16),
parseInt(hex.slice(3,5),16),
parseInt(hex.slice(5,7),16)
];

}

function drawMesh(o){

const mesh=getMesh(o);

const projected=
mesh.vertices.map(project);

const list=[];

mesh.faces.forEach(function(face){

let depth=0;

face.forEach(function(i){
depth+=mesh.vertices[i].z;
});

depth/=face.length;

list.push({
face:face,
depth:depth
});

});

list.sort(function(a,b){
return a.depth-b.depth;
});

const rgb=hexRgb(o.color);

list.forEach(function(item){

const f=item.face;

if(f.length<3)return;

ctx.beginPath();

ctx.moveTo(
projected[f[0]].x,
projected[f[0]].y
);

for(let i=1;i<f.length;i++){

ctx.lineTo(
projected[f[i]].x,
projected[f[i]].y
);

}

ctx.closePath();

let factor=.65;

if(item.depth>0){
factor=.8;
}

if(item.depth>2){
factor=.95;
}

ctx.fillStyle=
"rgb("+
Math.max(0,Math.min(255,Math.floor(rgb[0]*factor)))+
","+
Math.max(0,Math.min(255,Math.floor(rgb[1]*factor)))+
","+
Math.max(0,Math.min(255,Math.floor(rgb[2]*factor)))+
")";

ctx.fill();

ctx.strokeStyle=
o===selected?"#ffffff":"#111111";

ctx.lineWidth=
o===selected?1.8:1;

ctx.stroke();

});

}

function drawGrid(){

const r=canvas.getBoundingClientRect();

ctx.clearRect(
0,
0,
r.width,
r.height
);

ctx.fillStyle="#101014";

ctx.fillRect(
0,
0,
r.width,
r.height
);

for(let i=-10;i<=10;i++){

drawLine(
{x:i,y:0,z:-10},
{x:i,y:0,z:10},
i===0?"#555":"#28282d"
);

drawLine(
{x:-10,y:0,z:i},
{x:10,y:0,z:i},
i===0?"#555":"#28282d"
);

}

}

function drawLine(a,b,color){

const pa=project(a);
const pb=project(b);

ctx.strokeStyle=color;
ctx.lineWidth=1;

ctx.beginPath();
ctx.moveTo(pa.x,pa.y);
ctx.lineTo(pb.x,pb.y);
ctx.stroke();

}

function draw(){

drawGrid();

objects.forEach(function(o){
drawMesh(o);
});

}

canvas.addEventListener("pointerdown",function(e){

pointers.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);

try{
canvas.setPointerCapture(e.pointerId);
}catch(_){}

if(pointers.size===1){

dragStart={
x:e.clientX,
y:e.clientY
};

lastX=e.clientX;
lastY=e.clientY;
moved=false;

}

if(pointers.size===2){

const p=[...pointers.values()];

pinchDistance=Math.hypot(
p[0].x-p[1].x,
p[0].y-p[1].y
);

pinchZoom=camera.distance;

}

});

canvas.addEventListener("pointermove",function(e){

if(!pointers.has(e.pointerId)){
return;
}

pointers.set(
e.pointerId,
{
x:e.clientX,
y:e.clientY
}
);

if(pointers.size===2){

const p=[...pointers.values()];

const d=Math.hypot(
p[0].x-p[1].x,
p[0].y-p[1].y
);

if(pinchDistance>0){

camera.distance=
pinchZoom*
pinchDistance/
Math.max(1,d);

camera.distance=
Math.max(
2,
Math.min(30,camera.distance)
);

}

moved=true;
draw();

return;

}

if(pointers.size!==1){
return;
}

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

if(Math.abs(dx)+Math.abs(dy)>2){
moved=true;
}

camera.yaw-=dx*.008;
camera.pitch+=dy*.008;

camera.pitch=
Math.max(
-1.45,
Math.min(1.45,camera.pitch)
);

lastX=e.clientX;
lastY=e.clientY;

draw();

});

canvas.addEventListener("pointerup",function(e){

pointers.delete(e.pointerId);

if(pointers.size<2){
pinchDistance=0;
}

if(pointers.size===0){

dragStart=null;

}

});

canvas.addEventListener("pointercancel",function(e){

pointers.delete(e.pointerId);

if(pointers.size<2){
pinchDistance=0;
}

});

canvas.addEventListener("wheel",function(e){

e.preventDefault();

camera.distance+=e.deltaY*.01;

camera.distance=
Math.max(
2,
Math.min(30,camera.distance)
);

draw();

},{passive:false});

function exportOBJ(){

if(objects.length===0){

alert("モデルがありません。");
return;

}

let output=
"# Hiro 3D Model Maker\n";

let index=1;

objects.forEach(function(o){

const mesh=getMesh(o);

output+="\no "+o.name+"\n";

mesh.vertices.forEach(function(v){

output+=
"v "+
v.x.toFixed(6)+" "+
v.y.toFixed(6)+" "+
v.z.toFixed(6)+"\n";

});

mesh.faces.forEach(function(f){

output+="f ";

f.forEach(function(i){

output+=(index+i)+" ";

});

output+="\n";

});

index+=mesh.vertices.length;

});

const blob=new Blob(
[output],
{type:"text/plain"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download="hiro_3d_model.obj";

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(function(){
URL.revokeObjectURL(url);
},1000);

}

document.getElementById("exportButton")
.addEventListener("click",exportOBJ);

resize();

addObject("cube");

})();
</script>
