<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hiro 3D Model Maker</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#0d0d10;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
font:inherit;
}

button{
border:0;
color:#fff;
background:#29292e;
border-radius:11px;
}

button:active{
transform:scale(.96);
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

#top{
height:58px;
flex-shrink:0;
display:flex;
align-items:center;
gap:8px;
padding:8px 10px;
background:#18181b;
border-bottom:1px solid #303035;
z-index:20;
}

#title{
font-size:17px;
font-weight:800;
margin-right:auto;
}

.topButton{
height:42px;
padding:0 13px;
}

#main{
flex:1;
min-height:0;
display:flex;
}

#left{
width:210px;
flex-shrink:0;
padding:12px;
background:#18181b;
border-right:1px solid #303035;
overflow:auto;
}

#center{
position:relative;
flex:1;
min-width:0;
min-height:0;
background:#101014;
}

#right{
width:260px;
flex-shrink:0;
padding:12px;
background:#18181b;
border-left:1px solid #303035;
overflow:auto;
}

#canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block;
touch-action:none;
}

.sectionTitle{
font-size:12px;
font-weight:800;
color:#aaa;
margin:3px 0 9px;
}

.addGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.addButton{
height:68px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:3px;
font-size:10px;
background:#252529;
}

.addIcon{
font-size:24px;
}

#objectList{
display:flex;
flex-direction:column;
gap:6px;
}

.object{
width:100%;
min-height:43px;
padding:8px 10px;
text-align:left;
background:#252529;
border:1px solid transparent;
}

.object.selected{
background:#414148;
border-color:#888;
}

.editorTitle{
font-size:15px;
font-weight:800;
margin-bottom:14px;
}

#empty{
padding:12px;
border-radius:10px;
background:#222226;
color:#888;
font-size:12px;
line-height:1.6;
}

.field{
margin-bottom:12px;
}

.field label{
display:block;
font-size:11px;
font-weight:700;
color:#999;
margin-bottom:5px;
}

.field input{
width:100%;
height:40px;
padding:0 9px;
background:#252529;
border:1px solid #3d3d43;
border-radius:9px;
color:#fff;
outline:none;
}

.row{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.delete{
width:100%;
height:44px;
background:#8e2929;
margin-top:5px;
}

.mobilePanel{
display:none;
}

#bottom{
display:none;
}

#hint{
position:absolute;
left:50%;
bottom:14px;
transform:translateX(-50%);
padding:8px 13px;
background:rgba(0,0,0,.65);
border-radius:10px;
font-size:11px;
color:#bbb;
pointer-events:none;
white-space:nowrap;
z-index:5;
}

@media(max-width:700px){

#top{
height:54px;
padding:7px 8px;
}

#title{
font-size:14px;
}

.topButton{
height:38px;
font-size:10px;
padding:0 9px;
}

#left,
#right{
display:none;
}

#bottom{
position:fixed;
display:grid;
left:0;
right:0;
bottom:0;
width:100%;
height:70px;
grid-template-columns:repeat(4,1fr);
gap:6px;
padding:7px;
background:#18181b;
border-top:1px solid #303035;
z-index:9999;
}

.bottomButton{
height:55px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
background:#29292e;
font-size:10px;
}

.bottomIcon{
font-size:20px;
line-height:20px;
}

.mobilePanel{
position:fixed;
left:8px;
right:8px;
bottom:78px;
max-height:70vh;
overflow:auto;
padding:12px;
background:#1b1b1f;
border:1px solid #444;
border-radius:16px;
box-shadow:0 10px 40px rgba(0,0,0,.65);
z-index:9998;
}

.mobilePanel.open{
display:block;
}

.panelHeader{
display:flex;
align-items:center;
margin-bottom:10px;
}

.panelHeader strong{
margin-right:auto;
font-size:14px;
}

.closePanel{
width:36px;
height:36px;
font-size:20px;
}

.mobileAddGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.mobileAddButton{
height:65px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
font-size:10px;
}

.mobileAddIcon{
font-size:22px;
}

#mobileObjectsList{
display:flex;
flex-direction:column;
gap:6px;
}

#mobileEditor{
display:none;
}

#mobileEditor.show{
display:block;
}

#hint{
bottom:82px;
}

}

@media(max-width:420px){

.mobileAddGrid{
grid-template-columns:repeat(2,1fr);
}

}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>
(function(){

"use strict";

if(typeof THREE==="undefined"){
alert("3Dエンジンの読み込みに失敗しました。インターネット接続を確認してください。");
return;
}

const canvas=document.getElementById("canvas");

const renderer=new THREE.WebGLRenderer({
canvas:canvas,
antialias:true,
alpha:false
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio||1,2)
);

renderer.setClearColor(0x101014,1);

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
45,
1,
0.01,
1000
);

camera.position.set(
5,
4,
7
);

const ambient=new THREE.HemisphereLight(
0xffffff,
0x303030,
2
);

scene.add(ambient);

const light=new THREE.DirectionalLight(
0xffffff,
2.5
);

light.position.set(5,8,6);

scene.add(light);

const grid=new THREE.GridHelper(
20,
20,
0x555555,
0x29292d
);

scene.add(grid);

const objects=[];

let selected=null;
let counter=1;

const names={
box:"立方体",
box2:"直方体",
sphere:"球",
cylinder:"円柱",
cone:"円錐",
torus:"トーラス",
prism:"三角柱",
pyramid:"四角錐",
plane:"平面",
capsule:"カプセル",
tetra:"三角錐",
octa:"八面体"
};

const colors={
box:0x4da3ff,
box2:0x4da3ff,
sphere:0xff6688,
cylinder:0x72d66f,
cone:0xffc857,
torus:0xa875ff,
prism:0x4dd9ff,
pyramid:0xff8c42,
plane:0xaaaaaa,
capsule:0xff66c4,
tetra:0xff5577,
octa:0x55ddaa
};

function createGeometry(type){

if(type==="box"){
return new THREE.BoxGeometry(1,1,1);
}

if(type==="box2"){
return new THREE.BoxGeometry(1.8,1,1.2);
}

if(type==="sphere"){
return new THREE.SphereGeometry(
0.6,
32,
20
);
}

if(type==="cylinder"){
return new THREE.CylinderGeometry(
0.5,
0.5,
1.4,
32
);
}

if(type==="cone"){
return new THREE.ConeGeometry(
0.6,
1.5,
32
);
}

if(type==="torus"){
return new THREE.TorusGeometry(
0.75,
0.22,
16,
36
);
}

if(type==="prism"){

const shape=new THREE.Shape();

shape.moveTo(-0.6,-0.5);
shape.lineTo(0.6,-0.5);
shape.lineTo(0,0.5);
shape.lineTo(-0.6,-0.5);

return new THREE.ExtrudeGeometry(
shape,
{
depth:1,
bevelEnabled:false
}
);

}

if(type==="pyramid"){

const vertices=new Float32Array([
-0.6,-0.5,-0.6,
0.6,-0.5,-0.6,
0.6,-0.5,0.6,
-0.6,-0.5,0.6,
0,0.7,0
]);

const indices=[
0,1,2,
0,2,3,
0,4,1,
1,4,2,
2,4,3,
3,4,0
];

const g=new THREE.BufferGeometry();

g.setAttribute(
"position",
new THREE.BufferAttribute(vertices,3)
);

g.setIndex(indices);
g.computeVertexNormals();

return g;
}

if(type==="plane"){
return new THREE.PlaneGeometry(2,2);
}

if(type==="capsule"){
return new THREE.CapsuleGeometry(
0.45,
1,
12,
24
);
}

if(type==="tetra"){
return new THREE.TetrahedronGeometry(
0.8,
0
);
}

if(type==="octa"){
return new THREE.OctahedronGeometry(
0.8,
0
);
}

return new THREE.BoxGeometry(1,1,1);

}

function addObject(type){

const geometry=createGeometry(type);

const material=new THREE.MeshStandardMaterial({
color:colors[type],
roughness:.65,
metalness:.05
});

const mesh=new THREE.Mesh(
geometry,
material
);

mesh.position.set(0,0,0);

scene.add(mesh);

const obj={
mesh:mesh,
type:type,
name:names[type]+"_"+counter++
};

if(type==="box2"){
mesh.scale.set(1,1,1);
}

objects.push(obj);

selectObject(obj);

updateLists();

render();

}

document.querySelectorAll("[data-type]").forEach(function(button){

button.addEventListener("click",function(){

addObject(button.dataset.type);

const panel=button.closest(".mobilePanel");

if(panel){
panel.classList.remove("open");
}

});

});

function selectObject(obj){

if(selected){
selected.mesh.material.emissive.setHex(0x000000);
}

selected=obj;

if(selected){
selected.mesh.material.emissive.setHex(0x333333);
}

updateEditor();

updateLists();

render();

}

function updateLists(){

const desktop=document.getElementById("objectList");
const mobile=document.getElementById("mobileObjectsList");

desktop.innerHTML="";
mobile.innerHTML="";

if(objects.length===0){

mobile.innerHTML=
'<div style="color:#888;font-size:12px">パーツがありません。</div>';

return;
}

objects.forEach(function(obj){

const a=document.createElement("button");
const b=document.createElement("button");

a.className="object";
b.className="object";

if(obj===selected){
a.classList.add("selected");
b.classList.add("selected");
}

a.textContent=obj.name;
b.textContent=obj.name;

a.addEventListener("click",function(){
selectObject(obj);
});

b.addEventListener("click",function(){

selectObject(obj);

document.getElementById("partsPanel")
.classList.remove("open");

document.getElementById("settingsPanel")
.classList.add("open");

});

desktop.appendChild(a);
mobile.appendChild(b);

});

}

function setInput(prefix,id,value){

document.getElementById(prefix+id).value=value;

}

function updateEditor(){

const empty=document.getElementById("empty");
const editor=document.getElementById("editor");

const mobileEditor=document.getElementById("mobileEditor");
const mobileEmpty=document.getElementById("mobileNoSelection");

if(!selected){

empty.style.display="block";
editor.style.display="none";

mobileEditor.classList.remove("show");
mobileEmpty.style.display="block";

return;
}

empty.style.display="none";
editor.style.display="block";

mobileEditor.classList.add("show");
mobileEmpty.style.display="none";

const m=selected.mesh;

setInput("","name",selected.name);

setInput("","x",m.position.x.toFixed(2));
setInput("","y",m.position.y.toFixed(2));
setInput("","z",m.position.z.toFixed(2));

setInput("","rx",THREE.MathUtils.radToDeg(m.rotation.x).toFixed(1));
setInput("","ry",THREE.MathUtils.radToDeg(m.rotation.y).toFixed(1));
setInput("","rz",THREE.MathUtils.radToDeg(m.rotation.z).toFixed(1));

setInput("","sx",m.scale.x.toFixed(2));
setInput("","sy",m.scale.y.toFixed(2));
setInput("","sz",m.scale.z.toFixed(2));

setInput(
"",
"color",
"#"+m.material.color.getHexString()
);

setInput("m_","name",selected.name);

setInput("m_","x",m.position.x.toFixed(2));
setInput("m_","y",m.position.y.toFixed(2));
setInput("m_","z",m.position.z.toFixed(2));

setInput("m_","rx",THREE.MathUtils.radToDeg(m.rotation.x).toFixed(1));
setInput("m_","ry",THREE.MathUtils.radToDeg(m.rotation.y).toFixed(1));
setInput("m_","rz",THREE.MathUtils.radToDeg(m.rotation.z).toFixed(1));

setInput("m_","sx",m.scale.x.toFixed(2));
setInput("m_","sy",m.scale.y.toFixed(2));
setInput("m_","sz",m.scale.z.toFixed(2));

setInput(
"m_",
"color",
"#"+m.material.color.getHexString()
);

}

function number(id,fallback){

const n=parseFloat(
document.getElementById(id).value
);

return Number.isFinite(n)?n:fallback;

}

function mobileNumber(id,fallback){

const n=parseFloat(
document.getElementById("m_"+id).value
);

return Number.isFinite(n)?n:fallback;

}

function applyDesktop(){

if(!selected)return;

const m=selected.mesh;

selected.name=
document.getElementById("name").value||"Object";

m.position.x=number("x",m.position.x);
m.position.y=number("y",m.position.y);
m.position.z=number("z",m.position.z);

m.rotation.x=THREE.MathUtils.degToRad(number("rx",0));
m.rotation.y=THREE.MathUtils.degToRad(number("ry",0));
m.rotation.z=THREE.MathUtils.degToRad(number("rz",0));

m.scale.x=Math.max(.01,number("sx",1));
m.scale.y=Math.max(.01,number("sy",1));
m.scale.z=Math.max(.01,number("sz",1));

m.material.color.set(
document.getElementById("color").value
);

updateLists();
render();

}

function applyMobile(){

if(!selected)return;

const m=selected.mesh;

selected.name=
document.getElementById("m_name").value||"Object";

m.position.x=mobileNumber("x",m.position.x);
m.position.y=mobileNumber("y",m.position.y);
m.position.z=mobileNumber("z",m.position.z);

m.rotation.x=THREE.MathUtils.degToRad(mobileNumber("rx",0));
m.rotation.y=THREE.MathUtils.degToRad(mobileNumber("ry",0));
m.rotation.z=THREE.MathUtils.degToRad(mobileNumber("rz",0));

m.scale.x=Math.max(.01,mobileNumber("sx",1));
m.scale.y=Math.max(.01,mobileNumber("sy",1));
m.scale.z=Math.max(.01,mobileNumber("sz",1));

m.material.color.set(
document.getElementById("m_color").value
);

updateLists();
render();

}

let rotating=false;
let lastX=0;
let lastY=0;
let touchDistance=0;
let startCameraDistance=0;

canvas.addEventListener("pointerdown",function(e){

if(e.pointerType==="mouse" && e.button!==0){
return;
}

rotating=true;

lastX=e.clientX;
lastY=e.clientY;

try{
canvas.setPointerCapture(e.pointerId);
}catch(_){}

});

canvas.addEventListener("pointermove",function(e){

if(!rotating)return;

if(e.pointerType==="touch"){
return;
}

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

camera.position.x=
camera.position.x*Math.cos(-dx*.01)-
camera.position.z*Math.sin(-dx*.01);

camera.position.z=
camera.position.x*Math.sin(-dx*.01)+
camera.position.z*Math.cos(-dx*.01);

camera.position.y+=dy*.025;

camera.position.y=
THREE.MathUtils.clamp(
camera.position.y,
-10,
10
);

camera.lookAt(0,0,0);

lastX=e.clientX;
lastY=e.clientY;

render();

});

canvas.addEventListener("pointerup",function(){
rotating=false;
});

canvas.addEventListener("pointercancel",function(){
rotating=false;
});

canvas.addEventListener("touchstart",function(e){

if(e.touches.length===2){

const a=e.touches[0];
const b=e.touches[1];

touchDistance=Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

startCameraDistance=
camera.position.length();

}

},{passive:true});

canvas.addEventListener("touchmove",function(e){

if(e.touches.length!==2)return;

e.preventDefault();

const a=e.touches[0];
const b=e.touches[1];

const d=Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

if(touchDistance<=0)return;

const scale=
touchDistance/Math.max(1,d);

const newDistance=
THREE.MathUtils.clamp(
startCameraDistance*scale,
2,
40
);

const direction=
camera.position.clone().normalize();

camera.position.copy(
direction.multiplyScalar(newDistance)
);

camera.lookAt(0,0,0);

render();

},{passive:false});

canvas.addEventListener("touchend",function(){

touchDistance=0;

});

canvas.addEventListener("wheel",function(e){

e.preventDefault();

const direction=
camera.position.clone().normalize();

const distance=
THREE.MathUtils.clamp(
camera.position.length()+e.deltaY*.01,
2,
40
);

camera.position.copy(
direction.multiplyScalar(distance)
);

camera.lookAt(0,0,0);

render();

},{passive:false});

function exportOBJ(){

if(objects.length===0){

alert("パーツがありません。");
return;

}

let vertices=[];
let faces=[];
let offset=1;

objects.forEach(function(obj){

const mesh=obj.mesh;

mesh.updateMatrixWorld(true);

const position=
mesh.geometry.getAttribute("position");

const index=
mesh.geometry.getIndex();

for(let i=0;i<position.count;i++){

const v=new THREE.Vector3();

v.fromBufferAttribute(position,i);

v.applyMatrix4(mesh.matrixWorld);

vertices.push(v);

}

if(index){

const arr=index.array;

for(let i=0;i<arr.length;i+=3){

faces.push([
arr[i]+offset,
arr[i+1]+offset,
arr[i+2]+offset
]);

}

}else{

for(let i=0;i<position.count;i+=3){

faces.push([
i+offset,
i+1+offset,
i+2+offset
]);

}

}

offset+=position.count;

});

let text="# Hiro 3D Model Maker\n\n";

vertices.forEach(function(v){

text+=
"v "+
v.x.toFixed(6)+" "+
v.y.toFixed(6)+" "+
v.z.toFixed(6)+"\n";

});

text+="\n";

faces.forEach(function(f){

text+=
"f "+
f[0]+" "+
f[1]+" "+
f[2]+"\n";

});

const blob=new Blob(
[text],
{type:"text/plain"}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download="hiro_3d_model.obj";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(function(){
URL.revokeObjectURL(url);
},1000);

}

document.getElementById("exportButton")
.addEventListener("click",exportOBJ);

resize();

addObject("box");

})();
</script>
