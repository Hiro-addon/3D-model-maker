<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hiro 3D Model Maker</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#111;
    color:white;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#top{
    height:55px;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:8px;
    border-bottom:1px solid #333;
    z-index:10;
}

#title{
    font-weight:bold;
    font-size:18px;
    margin-right:auto;
}

button{
    border:0;
    border-radius:8px;
    background:#333;
    color:white;
    padding:9px 12px;
    font-size:14px;
    cursor:pointer;
}

button:active{
    transform:scale(.96);
}

#main{
    flex:1;
    min-height:0;
    display:flex;
}

#left{
    width:180px;
    background:#1b1b1b;
    border-right:1px solid #333;
    padding:10px;
    overflow:auto;
}

#left h3,
#right h3{
    margin:5px 0 10px;
    font-size:14px;
}

.add{
    width:100%;
    margin-bottom:7px;
}

#objects{
    margin-top:18px;
}

.object{
    width:100%;
    padding:9px;
    margin-bottom:5px;
    text-align:left;
    background:#292929;
    border-radius:7px;
}

.object.selected{
    background:#555;
}

#center{
    position:relative;
    flex:1;
    min-width:0;
    min-height:0;
}

#canvas{
    position:absolute;
    inset:0;
}

#right{
    width:240px;
    background:#1b1b1b;
    border-left:1px solid #333;
    padding:10px;
    overflow:auto;
}

.field{
    margin-bottom:10px;
}

.field label{
    display:block;
    font-size:12px;
    color:#aaa;
    margin-bottom:4px;
}

.field input{
    width:100%;
    background:#292929;
    color:white;
    border:1px solid #444;
    border-radius:6px;
    padding:8px;
    font-size:14px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
}

#empty{
    color:#888;
    font-size:13px;
    line-height:1.5;
}

#hint{
    position:absolute;
    left:10px;
    bottom:10px;
    background:rgba(0,0,0,.6);
    padding:8px 10px;
    border-radius:8px;
    font-size:12px;
    pointer-events:none;
}

#color{
    width:100%;
    height:40px;
    padding:2px;
}

@media(max-width:700px){
    #left{
        width:120px;
    }

    #right{
        width:180px;
    }

    #title{
        font-size:15px;
    }

    button{
        padding:8px;
        font-size:12px;
    }
}

@media(max-width:500px){
    #left{
        width:95px;
    }

    #right{
        width:155px;
    }

    #left h3,
    #right h3{
        font-size:12px;
    }

    .object,
    .add{
        font-size:11px;
        padding:7px;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="top">
    <div id="title">Hiro 3D Model Maker</div>
    <button onclick="resetCamera()">視点リセット</button>
    <button onclick="exportOBJ()">OBJ保存</button>
</div>

<div id="main">

<div id="left">

<h3>パーツ追加</h3>

<button class="add" onclick="addCube()">＋ 立方体</button>
<button class="add" onclick="addSphere()">＋ 球</button>
<button class="add" onclick="addCylinder()">＋ 円柱</button>

<div id="objects">
<h3>パーツ一覧</h3>
<div id="objectList"></div>
</div>

</div>

<div id="center">
    <div id="canvas"></div>
    <div id="hint">ドラッグ：回転　｜　ピンチ：拡大縮小</div>
</div>

<div id="right">

<h3>選択中のパーツ</h3>

<div id="empty">
パーツを追加して選択してください。
</div>

<div id="editor" style="display:none">

<div class="field">
<label>名前</label>
<input id="name" type="text">
</div>

<div class="field">
<label>位置 X / Y / Z</label>
<div class="row">
<input id="px" type="number" step="0.1">
<input id="py" type="number" step="0.1">
<input id="pz" type="number" step="0.1">
</div>
</div>

<div class="field">
<label>回転 X / Y / Z</label>
<div class="row">
<input id="rx" type="number" step="1">
<input id="ry" type="number" step="1">
<input id="rz" type="number" step="1">
</div>
</div>

<div class="field">
<label>サイズ X / Y / Z</label>
<div class="row">
<input id="sx" type="number" step="0.1" min="0.01">
<input id="sy" type="number" step="0.1" min="0.01">
<input id="sz" type="number" step="0.1" min="0.01">
</div>
</div>

<div class="field">
<label>色</label>
<input id="color" type="color">
</div>

<button onclick="deleteSelected()" style="width:100%;background:#8b2222">
削除
</button>

</div>

</div>

</div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";
import { OBJExporter } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/exporters/OBJExporter.js";

const container = document.getElementById("canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);

const camera = new THREE.PerspectiveCamera(
    60,
    container.clientWidth / container.clientHeight,
    0.01,
    1000
);

camera.position.set(5,4,6);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    preserveDrawingBuffer:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(container.clientWidth,container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.minDistance = 1;
controls.maxDistance = 100;

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
    0xffffff,
    2
);

light.position.set(5,10,5);
scene.add(light);

const grid = new THREE.GridHelper(
    20,
    20,
    0x555555,
    0x292929
);

scene.add(grid);

const axes = new THREE.AxesHelper(2);
scene.add(axes);

const root = new THREE.Group();
scene.add(root);

let objects = [];
let selected = null;
let counter = 1;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function createMaterial(color){
    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.7,
        metalness:.05
    });
}

function addObject(mesh,type){

    mesh.name = type + "_" + counter++;

    mesh.userData.type = type;
    mesh.userData.id = crypto.randomUUID();

    root.add(mesh);
    objects.push(mesh);

    selectObject(mesh);
    updateList();
}

window.addCube = function(){

    const geometry = new THREE.BoxGeometry(1,1,1);

    const mesh = new THREE.Mesh(
        geometry,
        createMaterial("#4da3ff")
    );

    addObject(mesh,"Cube");
};

window.addSphere = function(){

    const geometry = new THREE.SphereGeometry(
        .6,
        32,
        20
    );

    const mesh = new THREE.Mesh(
        geometry,
        createMaterial("#ff6688")
    );

    addObject(mesh,"Sphere");
};

window.addCylinder = function(){

    const geometry = new THREE.CylinderGeometry(
        .6,
        .6,
        1.2,
        32
    );

    const mesh = new THREE.Mesh(
        geometry,
        createMaterial("#72d66f")
    );

    addObject(mesh,"Cylinder");
};

function selectObject(obj){

    selected = obj;

    updateEditor();
    updateList();
}

function updateList(){

    const list = document.getElementById("objectList");

    list.innerHTML = "";

    objects.forEach(obj=>{

        const button = document.createElement("button");

        button.className = "object";

        if(obj === selected){
            button.classList.add("selected");
        }

        button.textContent = obj.name;

        button.onclick = ()=>{
            selectObject(obj);
        };

        list.appendChild(button);
    });
}

function updateEditor(){

    const empty = document.getElementById("empty");
    const editor = document.getElementById("editor");

    if(!selected){

        empty.style.display = "block";
        editor.style.display = "none";

        return;
    }

    empty.style.display = "none";
    editor.style.display = "block";

    document.getElementById("name").value = selected.name;

    document.getElementById("px").value = selected.position.x;
    document.getElementById("py").value = selected.position.y;
    document.getElementById("pz").value = selected.position.z;

    document.getElementById("rx").value =
        THREE.MathUtils.radToDeg(selected.rotation.x);

    document.getElementById("ry").value =
        THREE.MathUtils.radToDeg(selected.rotation.y);

    document.getElementById("rz").value =
        THREE.MathUtils.radToDeg(selected.rotation.z);

    document.getElementById("sx").value = selected.scale.x;
    document.getElementById("sy").value = selected.scale.y;
    document.getElementById("sz").value = selected.scale.z;

    document.getElementById("color").value =
        "#" + selected.material.color.getHexString();
}

function updateSelected(){

    if(!selected)return;

    selected.name =
        document.getElementById("name").value || "Object";

    selected.position.set(
        Number(document.getElementById("px").value) || 0,
        Number(document.getElementById("py").value) || 0,
        Number(document.getElementById("pz").value) || 0
    );

    selected.rotation.set(
        THREE.MathUtils.degToRad(
            Number(document.getElementById("rx").value) || 0
        ),
        THREE.MathUtils.degToRad(
            Number(document.getElementById("ry").value) || 0
        ),
        THREE.MathUtils.degToRad(
            Number(document.getElementById("rz").value) || 0
        )
    );

    selected.scale.set(
        Math.max(.01,Number(document.getElementById("sx").value) || 1),
        Math.max(.01,Number(document.getElementById("sy").value) || 1),
        Math.max(.01,Number(document.getElementById("sz").value) || 1)
    );

    selected.material.color.set(
        document.getElementById("color").value
    );

    updateList();
}

[
    "name",
    "px","py","pz",
    "rx","ry","rz",
    "sx","sy","sz",
    "color"
].forEach(id=>{

    document.getElementById(id).addEventListener(
        "input",
        updateSelected
    );

});

window.deleteSelected = function(){

    if(!selected)return;

    root.remove(selected);

    selected.geometry.dispose();
    selected.material.dispose();

    objects = objects.filter(
        obj=>obj !== selected
    );

    selected = null;

    updateEditor();
    updateList();
};

renderer.domElement.addEventListener(
    "pointerdown",
    event=>{

        const rect =
            renderer.domElement.getBoundingClientRect();

        pointer.x =
            ((event.clientX - rect.left) / rect.width) * 2 - 1;

        pointer.y =
            -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer,camera);

        const hits =
            raycaster.intersectObjects(objects);

        if(hits.length){
            selectObject(hits[0].object);
        }
    }
);

window.resetCamera = function(){

    camera.position.set(5,4,6);

    controls.target.set(0,0,0);

    controls.update();
};

window.exportOBJ = function(){

    if(objects.length === 0){

        alert("モデルがありません。");

        return;
    }

    root.updateMatrixWorld(true);

    const exporter = new OBJExporter();

    const result = exporter.parse(root);

    const blob = new Blob(
        [result],
        {type:"text/plain"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "hiro_3d_model.obj";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
};

function resize(){

    const w = container.clientWidth;
    const h = container.clientHeight;

    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    renderer.setSize(w,h);
}

window.addEventListener("resize",resize);

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);
}

animate();

addCube();

</script>

</body>
</html>
