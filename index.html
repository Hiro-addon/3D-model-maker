<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hiro 3D Model Maker</title>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#0d0d10;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{
font:inherit;
}
button{
border:0;
color:#fff;
background:#29292e;
border-radius:10px;
}
button:active{
transform:scale(.97);
}
#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}
#top{
height:56px;
flex-shrink:0;
display:flex;
align-items:center;
gap:8px;
padding:7px 10px;
background:#18181c;
border-bottom:1px solid #303035;
z-index:20;
}
#title{
font-size:16px;
font-weight:800;
margin-right:auto;
}
.topButton{
height:40px;
padding:0 12px;
}
#main{
flex:1;
min-height:0;
display:flex;
}
#left{
width:220px;
flex-shrink:0;
padding:12px;
background:#18181c;
border-right:1px solid #303035;
overflow:auto;
}
#center{
position:relative;
flex:1;
min-width:0;
min-height:0;
background:#101014;
}
#right{
width:270px;
flex-shrink:0;
padding:12px;
background:#18181c;
border-left:1px solid #303035;
overflow:auto;
}
#canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block;
touch-action:none;
}
.sectionTitle{
font-size:12px;
font-weight:800;
color:#aaa;
margin:2px 0 9px;
}
.addGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}
.addButton{
height:65px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:3px;
font-size:10px;
}
.addIcon{
font-size:22px;
}
#objectList{
display:flex;
flex-direction:column;
gap:6px;
}
.object{
width:100%;
min-height:42px;
padding:8px 10px;
text-align:left;
background:#252529;
border:1px solid transparent;
}
.object.selected{
background:#44444c;
border-color:#888;
}
.editorTitle{
font-size:15px;
font-weight:800;
margin-bottom:14px;
}
#empty{
padding:12px;
border-radius:10px;
background:#222226;
color:#888;
font-size:12px;
line-height:1.6;
}
.field{
margin-bottom:11px;
}
.field label{
display:block;
font-size:11px;
font-weight:700;
color:#999;
margin-bottom:5px;
}
.field input{
width:100%;
height:39px;
padding:0 9px;
background:#252529;
border:1px solid #3d3d43;
border-radius:9px;
color:#fff;
outline:none;
}
.row{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}
.delete{
width:100%;
height:43px;
background:#8c2b2b;
margin-top:5px;
}
#hint{
position:absolute;
left:50%;
bottom:12px;
transform:translateX(-50%);
padding:7px 12px;
background:rgba(0,0,0,.65);
border-radius:9px;
font-size:10px;
color:#aaa;
pointer-events:none;
white-space:nowrap;
}
.mobilePanel{
display:none;
}
#bottom{
display:none;
}
#loadInput{
display:none;
}
@media(max-width:700px){
#top{
height:54px;
padding:7px 8px;
}
#title{
font-size:14px;
}
.topButton{
height:38px;
font-size:10px;
padding:0 9px;
}
#left,#right{
display:none;
}
#main{
margin-bottom:70px;
}
#bottom{
position:fixed;
display:grid;
left:0;
right:0;
bottom:0;
height:70px;
grid-template-columns:repeat(4,1fr);
gap:6px;
padding:7px;
background:#18181c;
border-top:1px solid #303035;
z-index:9999;
padding-bottom:calc(7px + env(safe-area-inset-bottom));
height:calc(70px + env(safe-area-inset-bottom));
}
.bottomButton{
height:55px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
background:#29292e;
font-size:10px;
}
.bottomIcon{
font-size:19px;
line-height:20px;
}
.mobilePanel{
position:fixed;
left:8px;
right:8px;
bottom:78px;
max-height:70vh;
overflow:auto;
padding:12px;
background:#1b1b1f;
border:1px solid #444;
border-radius:16px;
box-shadow:0 10px 40px rgba(0,0,0,.7);
z-index:9998;
}
.mobilePanel.open{
display:block;
}
.panelHeader{
display:flex;
align-items:center;
margin-bottom:10px;
}
.panelHeader strong{
margin-right:auto;
font-size:14px;
}
.closePanel{
width:36px;
height:36px;
font-size:20px;
}
.mobileAddGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}
.mobileAddButton{
height:64px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
font-size:10px;
}
.mobileAddIcon{
font-size:21px;
}
#mobileObjectsList{
display:flex;
flex-direction:column;
gap:6px;
}
#mobileEditor{
display:none;
}
#mobileEditor.show{
display:block;
}
#mobileNoSelection{
font-size:12px;
color:#888;
}
#hint{
bottom:8px;
}
}
@media(max-width:420px){
.mobileAddGrid{
grid-template-columns:repeat(2,1fr);
}
}
</style>
</head>
<body>

<div id="app">

<div id="top">
<div id="title">Hiro 3D Model Maker</div>
<button class="topButton" id="resetButton">視点</button>
<button class="topButton" id="loadButton">ロード</button>
<button class="topButton" id="exportButton">OBJ保存</button>
<input id="loadInput" type="file" accept=".obj,text/plain">
</div>

<div id="main">

<div id="left">

<div class="sectionTitle">図形を追加</div>

<div class="addGrid">

<button class="addButton" data-type="box"><span class="addIcon">⬜</span>立方体</button>
<button class="addButton" data-type="box2"><span class="addIcon">▣</span>直方体</button>
<button class="addButton" data-type="sphere"><span class="addIcon">●</span>球</button>
<button class="addButton" data-type="cylinder"><span class="addIcon">⬭</span>円柱</button>
<button class="addButton" data-type="cone"><span class="addIcon">▲</span>円錐</button>
<button class="addButton" data-type="torus"><span class="addIcon">⭕</span>トーラス</button>
<button class="addButton" data-type="prism"><span class="addIcon">🔺</span>三角柱</button>
<button class="addButton" data-type="pyramid"><span class="addIcon">◆</span>四角錐</button>
<button class="addButton" data-type="plane"><span class="addIcon">▱</span>平面</button>
<button class="addButton" data-type="capsule"><span class="addIcon">💊</span>カプセル</button>
<button class="addButton" data-type="tetra"><span class="addIcon">△</span>三角錐</button>
<button class="addButton" data-type="octa"><span class="addIcon">◇</span>八面体</button>

</div>

<div class="sectionTitle" style="margin-top:20px">パーツ</div>
<div id="objectList"></div>

</div>

<div id="center">

<canvas id="canvas"></canvas>

<div id="hint">1本指：回転　2本指：拡大・縮小</div>

<div class="mobilePanel" id="addPanel">

<div class="panelHeader">
<strong>図形を追加</strong>
<button class="closePanel" data-close="addPanel">×</button>
</div>

<div class="mobileAddGrid">

<button class="mobileAddButton" data-type="box"><span class="mobileAddIcon">⬜</span>立方体</button>
<button class="mobileAddButton" data-type="box2"><span class="mobileAddIcon">▣</span>直方体</button>
<button class="mobileAddButton" data-type="sphere"><span class="mobileAddIcon">●</span>球</button>
<button class="mobileAddButton" data-type="cylinder"><span class="mobileAddIcon">⬭</span>円柱</button>
<button class="mobileAddButton" data-type="cone"><span class="mobileAddIcon">▲</span>円錐</button>
<button class="mobileAddButton" data-type="torus"><span class="mobileAddIcon">⭕</span>トーラス</button>
<button class="mobileAddButton" data-type="prism"><span class="mobileAddIcon">🔺</span>三角柱</button>
<button class="mobileAddButton" data-type="pyramid"><span class="mobileAddIcon">◆</span>四角錐</button>
<button class="mobileAddButton" data-type="plane"><span class="mobileAddIcon">▱</span>平面</button>
<button class="mobileAddButton" data-type="capsule"><span class="mobileAddIcon">💊</span>カプセル</button>
<button class="mobileAddButton" data-type="tetra"><span class="mobileAddIcon">△</span>三角錐</button>
<button class="mobileAddButton" data-type="octa"><span class="mobileAddIcon">◇</span>八面体</button>

</div>
</div>

<div class="mobilePanel" id="partsPanel">

<div class="panelHeader">
<strong>パーツ一覧</strong>
<button class="closePanel" data-close="partsPanel">×</button>
</div>

<div id="mobileObjectsList"></div>

</div>

<div class="mobilePanel" id="settingsPanel">

<div class="panelHeader">
<strong>パーツ設定</strong>
<button class="closePanel" data-close="settingsPanel">×</button>
</div>

<div id="mobileNoSelection">パーツを選択してください。</div>

<div id="mobileEditor">

<div class="field">
<label>名前</label>
<input id="m_name" type="text">
</div>

<div class="field">
<label>位置 X / Y / Z</label>
<div class="row">
<input id="m_x" type="number" step="0.1">
<input id="m_y" type="number" step="0.1">
<input id="m_z" type="number" step="0.1">
</div>
</div>

<div class="field">
<label>回転 X / Y / Z</label>
<div class="row">
<input id="m_rx" type="number" step="1">
<input id="m_ry" type="number" step="1">
<input id="m_rz" type="number" step="1">
</div>
</div>

<div class="field">
<label>サイズ X / Y / Z</label>
<div class="row">
<input id="m_sx" type="number" step="0.1" min="0.05">
<input id="m_sy" type="number" step="0.1" min="0.05">
<input id="m_sz" type="number" step="0.1" min="0.05">
</div>
</div>

<div class="field">
<label>色</label>
<input id="m_color" type="color">
</div>

<button class="delete" id="mobileDelete">削除</button>

</div>
</div>

</div>

<div id="right">

<div class="editorTitle">パーツ設定</div>

<div id="empty">パーツを選択してください。</div>

<div id="editor" style="display:none">

<div class="field">
<label>名前</label>
<input id="name" type="text">
</div>

<div class="field">
<label>位置 X / Y / Z</label>
<div class="row">
<input id="x" type="number" step="0.1">
<input id="y" type="number" step="0.1">
<input id="z" type="number" step="0.1">
</div>
</div>

<div class="field">
<label>回転 X / Y / Z</label>
<div class="row">
<input id="rx" type="number" step="1">
<input id="ry" type="number" step="1">
<input id="rz" type="number" step="1">
</div>
</div>

<div class="field">
<label>サイズ X / Y / Z</label>
<div class="row">
<input id="sx" type="number" step="0.1" min="0.05">
<input id="sy" type="number" step="0.1" min="0.05">
<input id="sz" type="number" step="0.1" min="0.05">
</div>
</div>

<div class="field">
<label>色</label>
<input id="color" type="color">
</div>

<button class="delete" id="deleteButton">削除</button>

</div>
</div>

</div>

<div id="bottom">

<button class="bottomButton" id="mobileAdd">
<span class="bottomIcon">＋</span>
追加
</button>

<button class="bottomButton" id="mobileParts">
<span class="bottomIcon">☷</span>
パーツ
</button>

<button class="bottomButton" id="mobileSettings">
<span class="bottomIcon">⚙</span>
編集
</button>

<button class="bottomButton" id="mobileReset">
<span class="bottomIcon">⟳</span>
視点
</button>

</div>

</div>

<script>
(function(){

"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;
let dpr=1;

let camera={
yaw:-0.65,
pitch:0.45,
distance:7
};

let objects=[];
let selected=null;
let counter=1;

const names={
box:"立方体",
box2:"直方体",
sphere:"球",
cylinder:"円柱",
cone:"円錐",
torus:"トーラス",
prism:"三角柱",
pyramid:"四角錐",
plane:"平面",
capsule:"カプセル",
tetra:"三角錐",
octa:"八面体"
};

const colors={
box:"#4da3ff",
box2:"#4da3ff",
sphere:"#ff6688",
cylinder:"#72d66f",
cone:"#ffc857",
torus:"#a875ff",
prism:"#4dd9ff",
pyramid:"#ff8c42",
plane:"#aaaaaa",
capsule:"#ff66c4",
tetra:"#ff5577",
octa:"#55ddaa"
};

function resize(){

const rect=document.getElementById("center").getBoundingClientRect();

dpr=Math.min(window.devicePixelRatio||1,2);

W=Math.max(1,rect.width);
H=Math.max(1,rect.height);

canvas.width=Math.round(W*dpr);
canvas.height=Math.round(H*dpr);

canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(dpr,0,0,dpr,0,0);

render();

}

window.addEventListener("resize",resize);

function v(x,y,z){
return{x:x,y:y,z:z};
}

function face(a,b,c,d){
return d===undefined?[a,b,c]:[a,b,c,d];
}

function geometry(type){

if(type==="box"){

return{
vertices:[
v(-.5,-.5,-.5),v(.5,-.5,-.5),
v(.5,.5,-.5),v(-.5,.5,-.5),
v(-.5,-.5,.5),v(.5,-.5,.5),
v(.5,.5,.5),v(-.5,.5,.5)
],
faces:[
face(0,1,2,3),
face(4,7,6,5),
face(0,4,5,1),
face(3,2,6,7),
face(0,3,7,4),
face(1,5,6,2)
]
};

}

if(type==="box2"){

const g=geometry("box");

g.vertices=g.vertices.map(function(p){
return v(p.x*1.6,p.y*.8,p.z*1.1);
});

return g;

}

if(type==="sphere"){

const vertices=[];
const faces=[];
const seg=20;
const rings=12;

for(let y=0;y<=rings;y++){

const t=y/rings;
const phi=t*Math.PI;

for(let x=0;x<seg;x++){

const a=x/seg*Math.PI*2;

vertices.push(
v(
Math.sin(phi)*Math.cos(a)*.65,
Math.cos(phi)*.65,
Math.sin(phi)*Math.sin(a)*.65
)
);

}

}

for(let y=0;y<rings;y++){

for(let x=0;x<seg;x++){

const a=y*seg+x;
const b=y*seg+(x+1)%seg;
const c=(y+1)*seg+(x+1)%seg;
const d=(y+1)*seg+x;

faces.push(face(a,b,c,d));

}

}

return{vertices,faces};

}

if(type==="cylinder"||type==="cone"){

const vertices=[];
const faces=[];
const seg=24;

for(let i=0;i<seg;i++){

const a=i/seg*Math.PI*2;

vertices.push(
v(
Math.cos(a)*.6,
-.7,
Math.sin(a)*.6
)
);

}

for(let i=0;i<seg;i++){

const a=i/seg*Math.PI*2;
const r=type==="cone"?0:.6;

vertices.push(
v(
Math.cos(a)*r,
.7,
Math.sin(a)*r
)
);

}

vertices.push(v(0,-.7,0));
vertices.push(v(0,.7,0));

for(let i=0;i<seg;i++){

const n=(i+1)%seg;

faces.push(face(i,n,seg+n,seg+i));
faces.push(face(seg*2,i,n));
faces.push(face(seg*2+1,seg+n,seg+i));

}

return{vertices,faces};

}

if(type==="torus"){

const vertices=[];
const faces=[];
const aSeg=28;
const bSeg=10;

for(let i=0;i<aSeg;i++){

const a=i/aSeg*Math.PI*2;

for(let j=0;j<bSeg;j++){

const b=j/bSeg*Math.PI*2;
const r=.75+.2*Math.cos(b);

vertices.push(
v(
Math.cos(a)*r,
Math.sin(b)*.2,
Math.sin(a)*r
)
);

}

}

for(let i=0;i<aSeg;i++){

for(let j=0;j<bSeg;j++){

const ni=(i+1)%aSeg;
const nj=(j+1)%bSeg;

faces.push(
face(
i*bSeg+j,
ni*bSeg+j,
ni*bSeg+nj,
i*bSeg+nj
)
);

}

}

return{vertices,faces};

}

if(type==="prism"){

return{
vertices:[
v(-.6,-.5,-.5),
v(.6,-.5,-.5),
v(0,.55,-.5),
v(-.6,-.5,.5),
v(.6,-.5,.5),
v(0,.55,.5)
],
faces:[
face(0,2,1),
face(3,4,5),
face(0,1,4,3),
face(1,2,5,4),
face(2,0,3,5)
]
};

}

if(type==="pyramid"){

return{
vertices:[
v(-.6,-.5,-.6),
v(.6,-.5,-.6),
v(.6,-.5,.6),
v(-.6,-.5,.6),
v(0,.7,0)
],
faces:[
face(0,3,2,1),
face(0,1,4),
face(1,2,4),
face(2,3,4),
face(3,0,4)
]
};

}

if(type==="plane"){

return{
vertices:[
v(-1,0,-1),
v(1,0,-1),
v(1,0,1),
v(-1,0,1)
],
faces:[
face(0,1,2,3)
]
};

}

if(type==="capsule"){

const vertices=[];
const faces=[];
const seg=16;
const rings=16;

for(let y=0;y<=rings;y++){

const t=y/rings;
const yy=-1+2*t;

let cy;
let r;

if(yy<-.5){

const q=(yy+.5)/.5;
const a=q*Math.PI/2;

cy=-.5-Math.cos(a)*.45;
r=Math.sin(a)*.45;

}else if(yy>.5){

const q=(yy-.5)/.5;
const a=q*Math.PI/2;

cy=.5+Math.sin(a)*.45;
r=Math.cos(a)*.45;

}else{

cy=yy;
r=.45;

}

for(let x=0;x<seg;x++){

const a=x/seg*Math.PI*2;

vertices.push(
v(
Math.cos(a)*r,
cy,
Math.sin(a)*r
)
);

}

}

for(let y=0;y<rings;y++){

for(let x=0;x<seg;x++){

const n=(x+1)%seg;

faces.push(
face(
y*seg+x,
y*seg+n,
(y+1)*seg+n,
(y+1)*seg+x
)
);

}

}

return{vertices,faces};

}

if(type==="tetra"){

return{
vertices:[
v(0,.7,0),
v(-.65,-.4,-.45),
v(.65,-.4,-.45),
v(0,-.4,.65)
],
faces:[
face(0,1,2),
face(0,2,3),
face(0,3,1),
face(1,3,2)
]
};

}

if(type==="octa"){

return{
vertices:[
v(0,.8,0),
v(0,-.8,0),
v(-.8,0,0),
v(.8,0,0),
v(0,0,-.8),
v(0,0,.8)
],
faces:[
face(0,2,4),
face(0,4,3),
face(0,3,5),
face(0,5,2),
face(1,4,2),
face(1,3,4),
face(1,5,3),
face(1,2,5)
]
};

}

return geometry("box");

}

function addObject(type){

const obj={
type:type,
name:names[type]+"_"+counter++,
position:v(
(objects.length%3-1)*1.6,
0,
Math.floor(objects.length/3)*1.2
),
rotation:v(0,0,0),
scale:v(1,1,1),
color:colors[type],
geometry:geometry(type)
};

objects.push(obj);
selectObject(obj);
updateLists();
render();

}

function selectObject(obj){

selected=obj;

updateLists();
updateEditor();
render();

}

function updateLists(){

const desktop=document.getElementById("objectList");
const mobile=document.getElementById("mobileObjectsList");

desktop.innerHTML="";
mobile.innerHTML="";

if(objects.length===0){

mobile.innerHTML='<div style="color:#888;font-size:12px">パーツがありません。</div>';
return;

}

objects.forEach(function(obj){

const a=document.createElement("button");
const b=document.createElement("button");

a.className="object";
b.className="object";

if(obj===selected){
a.classList.add("selected");
b.classList.add("selected");
}

a.textContent=obj.name;
b.textContent=obj.name;

a.onclick=function(){
selectObject(obj);
};

b.onclick=function(){

selectObject(obj);

document.getElementById("partsPanel").classList.remove("open");
document.getElementById("settingsPanel").classList.add("open");

};

desktop.appendChild(a);
mobile.appendChild(b);

});

}

function val(id){
return parseFloat(document.getElementById(id).value);
}

function mval(id){
return parseFloat(document.getElementById("m_"+id).value);
}

function safe(n,f){
return Number.isFinite(n)?n:f;
}

function updateEditor(){

const empty=document.getElementById("empty");
const editor=document.getElementById("editor");

const mobileEmpty=document.getElementById("mobileNoSelection");
const mobileEditor=document.getElementById("mobileEditor");

function rotatePoint(p,o){

let x=p.x*o.scale.x;
let y=p.y*o.scale.y;
let z=p.z*o.scale.z;

let rx=o.rotation.x*Math.PI/180;
let ry=o.rotation.y*Math.PI/180;
let rz=o.rotation.z*Math.PI/180;

let cy=Math.cos(rx);
let sy=Math.sin(rx);

let ny=y*cy-z*sy;
let nz=y*sy+z*cy;

y=ny;
z=nz;

let cx=Math.cos(ry);
let sx=Math.sin(ry);

let nx=x*cx+z*sx;
nz=-x*sx+z*cx;

x=nx;
z=nz;

let cz=Math.cos(rz);
let sz=Math.sin(rz);

nx=x*cz-y*sz;
ny=x*sz+y*cz;

x=nx;
y=ny;

return{
x:x+o.position.x,
y:y+o.position.y,
z:z+o.position.z
};

}

function cameraPoint(p){

const cy=Math.cos(camera.yaw);
const sy=Math.sin(camera.yaw);

let x=p.x*cy-p.z*sy;
let z=p.x*sy+p.z*cy;

const cp=Math.cos(camera.pitch);
const sp=Math.sin(camera.pitch);

let y=p.y*cp-z*sp;
z=p.y*sp+z*cp;

return{
x:x,
y:y,
z:z
};

}

function project(p){

const c=cameraPoint(p);

const depth=c.z+camera.distance;

if(depth<=.1)return null;

const focal=Math.min(W,H)*.9;

return{
x:W/2+c.x*focal/depth,
y:H/2-c.y*focal/depth,
depth:depth
};

}

function shade(hex,amount){

hex=hex.replace("#","");

let r=parseInt(hex.substring(0,2),16);
let g=parseInt(hex.substring(2,4),16);
let b=parseInt(hex.substring(4,6),16);

r=Math.max(0,Math.min(255,Math.round(r*amount)));
g=Math.max(0,Math.min(255,Math.round(g*amount)));
b=Math.max(0,Math.min(255,Math.round(b*amount)));

return"rgb("+r+","+g+","+b+")";

}

function normal(a,b,c){

const ux=b.x-a.x;
const uy=b.y-a.y;
const uz=b.z-a.z;

const vx=c.x-a.x;
const vy=c.y-a.y;
const vz=c.z-a.z;

return{
x:uy*vz-uz*vy,
y:uz*vx-ux*vz,
z:ux*vy-uy*vx
};

}

function render(){

ctx.setTransform(dpr,0,0,dpr,0,0);

ctx.clearRect(0,0,W,H);

const gradient=ctx.createLinearGradient(0,0,0,H);

gradient.addColorStop(0,"#15151a");
gradient.addColorStop(1,"#09090c");

ctx.fillStyle=gradient;
ctx.fillRect(0,0,W,H);

drawGrid();

const drawFaces=[];

objects.forEach(function(o){

const world=o.geometry.vertices.map(function(p){
return rotatePoint(p,o);
});

const projected=world.map(project);

o.geometry.faces.forEach(function(f){

const points=f.map(function(i){
return projected[i];
});

if(points.some(function(p){return!p;}))return;

let depth=0;

points.forEach(function(p){
depth+=p.depth;
});

depth/=points.length;

const a=world[f[0]];
const b=world[f[1]];
const c=world[f[2]];

const n=normal(a,b,c);

const len=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;

n.x/=len;
n.y/=len;
n.z/=len;

const light=Math.max(.18,n.x*.35+n.y*.75+n.z*.5);

drawFaces.push({
object:o,
points:points,
depth:depth,
light:light
});

});

});

drawFaces.sort(function(a,b){
return b.depth-a.depth;
});

drawFaces.forEach(function(f){

ctx.beginPath();

ctx.moveTo(f.points[0].x,f.points[0].y);

for(let i=1;i<f.points.length;i++){
ctx.lineTo(f.points[i].x,f.points[i].y);
}

ctx.closePath();

let amount=.65+f.light*.5;

if(f.object===selected){
amount+=.12;
}

ctx.fillStyle=shade(f.object.color,amount);
ctx.fill();

ctx.strokeStyle=f.object===selected?
"rgba(255,255,255,.75)":
"rgba(0,0,0,.35)";

ctx.lineWidth=f.object===selected?1.5:1;

ctx.stroke();

});

if(selected){
drawSelection(selected);
}

}

function drawGrid(){

const size=10;

for(let i=-size;i<=size;i++){

drawLine(
v(i,0,-size),
v(i,0,size),
"rgba(100,100,110,.22)"
);

drawLine(
v(-size,0,i),
v(size,0,i),
"rgba(100,100,110,.22)"
);

}

drawLine(
v(-size,0,0),
v(size,0,0),
"rgba(255,80,80,.45)"
);

drawLine(
v(0,0,-size),
v(0,0,size),
"rgba(80,150,255,.45)"
);

drawLine(
v(0,-size,0),
v(0,size,0),
"rgba(100,255,120,.45)"
);

}

function drawLine(a,b,color){

const pa=project(a);
const pb=project(b);

if(!pa||!pb)return;

ctx.beginPath();
ctx.moveTo(pa.x,pa.y);
ctx.lineTo(pb.x,pb.y);
ctx.strokeStyle=color;
ctx.lineWidth=1;
ctx.stroke();

}

function drawSelection(o){

const pts=o.geometry.vertices
.map(function(p){
return project(rotatePoint(p,o));
})
.filter(Boolean);

if(!pts.length)return;

let minX=Infinity;
let minY=Infinity;
let maxX=-Infinity;
let maxY=-Infinity;

pts.forEach(function(p){

minX=Math.min(minX,p.x);
minY=Math.min(minY,p.y);
maxX=Math.max(maxX,p.x);
maxY=Math.max(maxY,p.y);

});

ctx.save();

ctx.strokeStyle="rgba(255,255,255,.5)";
ctx.setLineDash([5,5]);

ctx.strokeRect(
minX-5,
minY-5,
maxX-minX+10,
maxY-minY+10
);

ctx.restore();

}

let pointers=new Map();
let lastSingle=null;
let pinchStart=0;
let pinchCamera=0;

canvas.addEventListener("pointerdown",function(e){

pointers.set(e.pointerId,{
x:e.clientX,
y:e.clientY
});

if(pointers.size===1){

lastSingle={
x:e.clientX,
y:e.clientY
};

}

if(pointers.size===2){

const a=[...pointers.values()][0];
const b=[...pointers.values()][1];

pinchStart=Math.hypot(
a.x-b.x,
a.y-b.y
);

pinchCamera=camera.distance;

}

try{
canvas.setPointerCapture(e.pointerId);
}catch(_){}

});

canvas.addEventListener("pointermove",function(e){

if(!pointers.has(e.pointerId))return;

pointers.set(e.pointerId,{
x:e.clientX,
y:e.clientY
});

if(pointers.size===1){

if(!lastSingle){

lastSingle={
x:e.clientX,
y:e.clientY
};

return;

}

const dx=e.clientX-lastSingle.x;
const dy=e.clientY-lastSingle.y;

camera.yaw-=dx*.008;
camera.pitch-=dy*.008;

camera.pitch=Math.max(
-.95,
Math.min(.95,camera.pitch)
);

lastSingle={
x:e.clientX,
y:e.clientY
};

render();

return;

}

if(pointers.size===2){

const arr=[...pointers.values()];

const d=Math.hypot(
arr[0].x-arr[1].x,
arr[0].y-arr[1].y
);

if(pinchStart>0){

camera.distance=Math.max(
2,
Math.min(
30,
pinchCamera*(pinchStart/Math.max(1,d))
)
);

}

render();

}

});

function pointerEnd(e){

pointers.delete(e.pointerId);

if(pointers.size===0){

lastSingle=null;
pinchStart=0;

}

if(pointers.size===1){

const p=[...pointers.values()][0];

lastSingle={
x:p.x,
y:p.y
};

}

}

canvas.addEventListener("pointerup",pointerEnd);
canvas.addEventListener("pointercancel",pointerEnd);

canvas.addEventListener("wheel",function(e){

e.preventDefault();

camera.distance+=e.deltaY*.008;

camera.distance=Math.max(
2,
Math.min(30,camera.distance)
);

render();

},{passive:false});

canvas.addEventListener("dblclick",resetView);

let clickStart=null;

canvas.addEventListener("pointerdown",function(e){

if(pointers.size===1){

clickStart={
x:e.clientX,
y:e.clientY
};

}

});

function pick(x,y){

let best=null;
let bestDistance=Infinity;

objects.forEach(function(o){

const center=project(o.position);

if(!center)return;

const size=Math.max(
25,
Math.min(
120,
90/camera.distance
)
);

const d=Math.hypot(
x-center.x,
y-center.y
);

if(d<size&&d<bestDistance){

best=o;
bestDistance=d;

}

});

if(best){
selectObject(best);
}

}

canvas.addEventListener("pointerup",function(e){

if(!clickStart)return;

const dx=e.clientX-clickStart.x;
const dy=e.clientY-clickStart.y;

if(Math.hypot(dx,dy)<6){
pick(e.clientX,e.clientY);
}

clickStart=null;

});

function exportOBJ(){

if(objects.length===0){

alert("パーツがありません。");
return;

}

let output="# Hiro 3D Model Maker\n\n";
let offset=1;

objects.forEach(function(o){

output+="o "+o.name.replace(/\s/g,"_")+"\n";

o.geometry.vertices.forEach(function(p){

const q=rotatePoint(p,o);

output+="v "+
q.x.toFixed(6)+" "+
q.y.toFixed(6)+" "+
q.z.toFixed(6)+"\n";

});

o.geometry.faces.forEach(function(f){

output+="f ";

f.forEach(function(i){
output+=(i+offset)+" ";
});

output+="\n";

});

offset+=o.geometry.vertices.length;

output+="\n";

});

const blob=new Blob(
[output],
{type:"text/plain"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download="hiro_3d_model.obj";

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(function(){
URL.revokeObjectURL(url);
},1000);

}

document.getElementById("exportButton").onclick=exportOBJ;

function clearObjects(){

objects=[];
selected=null;
counter=1;

updateLists();
updateEditor();
render();

}

function loadOBJ(text){

const vertices=[];
const loadedFaces=[];
const loadedObjects=[];

const lines=text.split(/\r?\n/);

let currentName="Model";

for(let line of lines){

line=line.trim();

if(!line)continue;

if(line.startsWith("o ")){

currentName=line.substring(2).trim()||"Model";

continue;

}

if(line.startsWith("v ")){

const p=line.split(/\s+/);

if(p.length>=4){

vertices.push(
v(
parseFloat(p[1])||0,
parseFloat(p[2])||0,
parseFloat(p[3])||0
)
);

}

continue;

}

if(line.startsWith("f ")){

const p=line.substring(2).trim().split(/\s+/);

const ids=[];

for(const item of p){

const first=item.split("/")[0];
let index=parseInt(first,10);

if(!Number.isFinite(index))continue;

if(index<0){
index=vertices.length+index;
}else{
index=index-1;
}

if(index>=0&&index<vertices.length){
ids.push(index);
}

}

if(ids.length>=3){

for(let i=1;i<ids.length-1;i++){

loadedFaces.push(
face(
ids[0],
ids[i],
ids[i+1]
)
);

}

}

}

}

if(vertices.length===0||loadedFaces.length===0){

alert("OBJファイルを読み込めませんでした。");
return;

}

const min=v(Infinity,Infinity,Infinity);
const max=v(-Infinity,-Infinity,-Infinity);

vertices.forEach(function(p){

min.x=Math.min(min.x,p.x);
min.y=Math.min(min.y,p.y);
min.z=Math.min(min.z,p.z);

max.x=Math.max(max.x,p.x);
max.y=Math.max(max.y,p.y);
max.z=Math.max(max.z,p.z);

});

const center=v(
(min.x+max.x)/2,
(min.y+max.y)/2,
(min.z+max.z)/2
);

const size=Math.max(
max.x-min.x,
max.y-min.y,
max.z-min.z
);

const scale=size>0?2/size:1;

const normalizedVertices=vertices.map(function(p){

return v(
(p.x-center.x)*scale,
(p.y-center.y)*scale,
(p.z-center.z)*scale
);

});

const obj={
type:"box",
name:currentName||"ロードモデル",
position:v(0,0,0),
rotation:v(0,0,0),
scale:v(1,1,1),
color:"#4da3ff",
geometry:{
vertices:normalizedVertices,
faces:loadedFaces
}
};

objects.push(obj);
selected=obj;
counter++;

updateLists();
updateEditor();
resetView();
render();

}

document.getElementById("loadButton").onclick=function(){

document.getElementById("loadInput").value="";
document.getElementById("loadInput").click();

};

document.getElementById("loadInput").addEventListener("change",function(){

const file=this.files&&this.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(){

try{

clearObjects();
loadOBJ(String(reader.result));

}catch(e){

alert("OBJファイルを読み込めませんでした。");

}

};

reader.onerror=function(){
alert("ファイルの読み込みに失敗しました。");
};

reader.readAsText(file);

});

resize();

})();
